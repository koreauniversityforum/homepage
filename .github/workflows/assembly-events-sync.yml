name: 국회 토론회 일정 가져오기

on:
  schedule:
    - cron: '*/5 * * * *' # 5분마다 확인(GitHub 사정에 따라 실제 시작은 늦어질 수 있음)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: assembly-events-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 국회 일정 확인
        run: node scripts/sync-assembly-events.mjs
      - name: 바뀐 일정 커밋
        run: |
          if git diff --quiet -- public/data/assembly-events.json; then
            echo "바뀐 일정이 없습니다."
            exit 0
          fi
          git config user.name "kuf-bot"
          git config user.email "koreauniversityforum@gmail.com"
          git add public/data/assembly-events.json
          git commit -m "국회 토론회 일정 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d'))"
          git push
